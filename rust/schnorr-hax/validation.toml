# Validation manifest
primitive = "Schnorr signatures (BIP-340 Taproot, secp256k1)"
reference = "BIP-340 official test vectors (bitcoin/bips, bip-0340/test-vectors.csv) + RustCrypto k256 0.13 schnorr (BIP-340 signer/verifier) and sha2 (BIP-340 tagged SHA-256)"
reference_kind = "paper-vectors"
test_files = ["tests/reference_crosscheck.rs"]
notes = "reference_crosscheck.rs instantiates the crate's generic SchnorrCrypto trait with the real secp256k1 group (k256) and the real BIP-340 tagged SHA-256 hashes (sha2), then drives OUR scheme functions. crate_sign_matches_bip340_vectors is a byte-for-byte KAT: OUR sign reproduces the published 64-byte signature for BIP-340 vectors 0-3 (the harness supplies BIP-340's even-y canonical secret/nonce, which the abstract group cannot derive itself). crate_hash_challenge_matches_bip340 pins OUR hash_challenge to the BIP-340 challenge tagged hash and checks s*G == R + e*P on the curve. crate_scalar_and_group_mul_match_secp256k1 ties OUR scalar_add/scalar_mul/scalar_inv/group_mul to k256 over the real field and reproduces the x-only public keys. reference_verifier_pins_vectors reproduces every published TRUE/FALSE via k256 verify_raw and every published signature via k256 sign_raw. crate_verify_group_add_gap records the trait boundary: OUR verify needs group_add(R, e*P), which is not total on the x-only 32-byte encoding, so it agrees with the BIP-340 reference exactly when e*P has even y (asserted against k256). tests/kat_vectors.rs is a toy Z_65521 model of protocol logic only, not this reference."
