# Validation manifest
primitive = "ML-KEM-768 (FIPS 203), Fujisaki-Okamoto layer: ML-KEM.KeyGen_internal, Encaps_internal, Decaps_internal (Algorithms 16-18)"
reference = "Official ML-KEM-768 NIST known-answer test vectors 0 and 1 (libcrux mlkem768_nistkats.json, libcrux-ml-kem/cg/tests), run through the test instance MlKem768Ops of FoOps: key-generation seed d‖z and encapsulation coin m map to the SHA3-256 hashes of the public key, secret key and ciphertext plus the raw shared secret"
reference_kind = "nist-cavp"
test_files = ["tests/nist_kat.rs", "tests/libcrux_diff.rs"]
notes = "The crate is the FO orchestration layer only: keygen, encaps and decaps are generic over the trait FoOps, whose operations are K-PKE.KeyGen/Encrypt/Decrypt, H = SHA3-256, G = SHA3-512 split into (K, r), J = SHAKE256 with 32 bytes of output, and the ciphertext comparison. The crate has no dependencies. libcrux_diff.rs runs the generic layer beside the published libcrux-ml-kem 0.0.10 (mlkem768::generate_key_pair, encapsulate, decapsulate, derandomised) on 64 pseudo-random seed pairs and asserts byte equality of ek, dk, ct, the shared secret, honest decapsulation and the decapsulation of a ciphertext with one flipped bit; libcrux's K-PKE and FO layer are crate-private, so the comparison is at its public KEM interface. The instance MlKem768Ops in tests/common/mod.rs takes K-PKE and FIPS 202 SHA-3 from mlkem-hax, a dev-dependency used for the tests only. nist_kat_0_byte_identical and nist_kat_1_byte_identical drive the GENERIC keygen::<MlKem768Ops>, encaps and decaps on the NIST vectors and assert SHA3-256(ek), SHA3-256(dk), SHA3-256(ct) and the shared secret byte for byte; the vectors therefore validate the orchestration of this crate together with the K-PKE and SHA-3 of mlkem-hax. nist_kat_implicit_reject checks that a tampered ciphertext decapsulates to J(z ‖ c). generic_layer_agrees_with_mlkem_hax checks that the generic layer and mlkem-hax's concrete mlkem_keygen/mlkem_encaps/mlkem_decaps agree byte for byte on the KAT inputs and on a tampered ciphertext; this is a consistency check between two implementations of the same layer, not an independent reference."
