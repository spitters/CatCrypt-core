name: CI

on:
  push:
    branches: [main, "lean-*"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blueprint-refs:
    # Every blueprint \lean{...} reference must name a declaration in the
    # sources. Textual, without loading Lean: the declaration list is the one
    # build_web.sh extracts for the published blueprint (docs.yml runs the same
    # check), so the blueprint cannot drift from the library between releases.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Extract the declaration list
        run: python3 scripts/gen_decl_index.py

      - name: Check that every \lean{...} reference names a declaration
        run: |
          python3 - <<'PY'
          import glob, re, sys
          decls = set(open("blueprint/lean_decls").read().split())
          missing = []
          for f in sorted(glob.glob("blueprint/src/chapters/*.tex")):
              for m in re.finditer(r"\\lean\{([^}]*)\}", open(f).read()):
                  missing += [(f, n.strip()) for n in m.group(1).split(",")
                              if n.strip() not in decls]
          for f, n in missing:
              print(f"::error file={f}::unknown declaration {n}")
          sys.exit(1 if missing else 0)
          PY

  build:
    runs-on: ubuntu-latest
    # A cold build with the Mathlib cache took 31 to 42 minutes in November 2026.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # The restored `.lake` archive, the Mathlib cache and the build outputs share
      # the runner's root volume; the preinstalled toolchains the job never uses
      # are removed first.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      # lean-action installs elan, restores `.lake` from the Actions cache (key:
      # toolchain, manifest and commit, falling back to the newest entry for the
      # same toolchain and manifest), runs `lake exe cache get` for Mathlib, builds,
      # saves `.lake` when the restore was not an exact hit, and then audits axioms.
      #
      # The build is also the sorry guard: the package is built under
      # `-E hasSorry` (see lakefile.lean), so a declaration whose proof term
      # reaches `sorryAx` is an error and fails the build.
      #
      # Axiom audit: every declaration in a module under `CatCryptCore` that the
      # root module `CatCryptCore` imports may depend only on the listed axioms:
      # Lean's three standard axioms, `Lean.ofReduceBool` and `Lean.trustCompiler`
      # (native_decide is accepted), and the three Curve25519 trust edges of
      # `CatCryptCore/Crypto/KeyAgreement/Curve25519.lean`, which bridge the
      # AUCurves development. The audit reads the compiled environment, so it
      # also catches an axiom declared through a macro or reached through a
      # dependency, and it limits the Curve25519 file to those three names. The
      # earlier textual guard (`git grep '^ *axiom '` outside that file) did
      # neither and matched a docstring line beginning with the word.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          build-args: "CatCryptCore CatCryptCoreTest"
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
          axiom-audit: true
          axiom-audit-allow: "propext,Classical.choice,Quot.sound,Lean.ofReduceBool,Lean.trustCompiler,CatCrypt.Crypto.ECC.curve25519_basepoint,CatCrypt.Crypto.ECC.curve25519_basepoint_order_nsmul,CatCrypt.Crypto.ECC.curve25519_basepoint_ne_zero"
      # The audit above reads the modules the root module CatCryptCore imports. The examples
      # root, the tactic tests under CatCryptCore/Tactics and the time-certificate companions
      # are not among them, so the same tool (the version lean-action pins) audits every module
      # under CatCryptCore/ with the same allowlist.
      - name: Axiom audit of every module under CatCryptCore/
        run: |
          work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/axiom-audit-all.XXXXXX")"
          git clone --depth 1 --branch v0.1.2 https://github.com/leanprover-community/axiom-audit.git "$work/axiom-audit"
          test "$(git -C "$work/axiom-audit" rev-parse HEAD)" = 46024e005996495c65ef609368e11ab39c4222e3
          cp lean-toolchain "$work/axiom-audit/"
          (cd "$work/axiom-audit" && lake build)
          lake env "$work/axiom-audit/.lake/build/bin/axiom-audit" --modules-from CatCryptCore \
            --allow "propext,Classical.choice,Quot.sound,Lean.ofReduceBool,Lean.trustCompiler,CatCrypt.Crypto.ECC.curve25519_basepoint,CatCrypt.Crypto.ECC.curve25519_basepoint_order_nsmul,CatCrypt.Crypto.ECC.curve25519_basepoint_ne_zero"
