name: CI

on:
  push:
    branches: [main, "lean-*"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Text gates against empty statements: a bound assumed for every adversary,
    # a point mass against uniform, equal real and ideal games, a free body or
    # frame, a returned argument, and a headline without a witness. No toolchain.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: No new bound over every adversary and no new empty statement shape
        if: ${{ !cancelled() }}
        run: bash scripts/unbounded-hardness-ratchet.sh

      - name: Headlines are registered and have a witness or a recorded gap
        if: ${{ !cancelled() }}
        run: bash scripts/headline-witness-gate.sh

      - name: Tests of the headline witness gate
        if: ${{ !cancelled() }}
        run: bash scripts/test_headline_witness_gate.sh

      - name: The shared gates are unedited copies
        if: ${{ !cancelled() }}
        run: bash scripts/gate-copies.sh

  blueprint-refs:
    # Every blueprint \lean{...} reference must name a declaration in the
    # sources. Textual, without loading Lean: the declaration list is the one
    # build_web.sh extracts for the published blueprint (docs.yml runs the same
    # check), so the blueprint cannot drift from the library between releases.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Extract the declaration list
        run: python3 scripts/gen_decl_index.py

      - name: Check that every \lean{...} reference names a declaration
        run: |
          python3 - <<'PY'
          import glob, re, sys
          decls = set(open("blueprint/lean_decls").read().split())
          missing = []
          for f in sorted(glob.glob("blueprint/src/chapters/*.tex")):
              for m in re.finditer(r"\\lean\{([^}]*)\}", open(f).read()):
                  missing += [(f, n.strip()) for n in m.group(1).split(",")
                              if n.strip() not in decls]
          for f, n in missing:
              print(f"::error file={f}::unknown declaration {n}")
          sys.exit(1 if missing else 0)
          PY

  build:
    needs: gates
    runs-on: ubuntu-latest
    # A cold build with the Mathlib cache took 31 to 42 minutes in November 2026.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # The restored `.lake` archive, the Mathlib cache and the build outputs share
      # the runner's root volume; the preinstalled toolchains the job never uses
      # are removed first.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      # lean-action installs elan, restores `.lake` from the Actions cache (key:
      # toolchain, manifest and commit, falling back to the newest entry for the
      # same toolchain and manifest), runs `lake exe cache get` for Mathlib, builds,
      # saves `.lake` when the restore was not an exact hit, and then audits axioms.
      #
      # The build is also the sorry guard: the package is built under
      # `-E hasSorry` (see lakefile.lean), so a declaration whose proof term
      # reaches `sorryAx` is an error and fails the build.
      #
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          build-args: "CatCryptCore CatCryptCoreTest"
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
      # Axiom audit: every declaration in a module under `CatCryptCore/` (the umbrella, the
      # examples root, the tactic tests and the time-certificate companions) may depend only
      # on Lean's three standard axioms. native_decide is outside the
      # audit: its axioms (`Lean.ofReduceBool`, `Lean.trustCompiler`, and the per-use
      # `._native.native_decide.ax_*` of Lean 4.35) are neither checked nor reported; a
      # native_decide matters only as build time. The tool (leanprover-community/axiom-audit,
      # the version lean-action v1.7.1 pins) reads the compiled environment, so it also
      # catches an axiom declared through a macro or reached through a dependency.
      - name: Axiom audit of every module under CatCryptCore/
        run: |
          work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/axiom-audit-all.XXXXXX")"
          git clone --depth 1 --branch v0.1.2 https://github.com/leanprover-community/axiom-audit.git "$work/axiom-audit"
          test "$(git -C "$work/axiom-audit" rev-parse HEAD)" = 46024e005996495c65ef609368e11ab39c4222e3
          cp lean-toolchain "$work/axiom-audit/"
          (cd "$work/axiom-audit" && lake build)
          lake env "$work/axiom-audit/.lake/build/bin/axiom-audit" --modules-from CatCryptCore --json \
            --allow "propext,Classical.choice,Quot.sound,Lean.ofReduceBool,Lean.trustCompiler" \
            > "$work/audit.json" || true
          jq -e '.audited > 0' "$work/audit.json" > /dev/null
          bad=$(jq -r '[.violations[] | {decl, axioms: [.axioms[] | select(test("\\._native\\.native_decide\\.ax_") | not)]} | select(.axioms | length > 0)]' "$work/audit.json")
          echo "audited $(jq .audited "$work/audit.json") declarations; axioms used (native_decide aside): $(jq -c '[.axiomsUsed[] | select(test("native_decide|^Lean\\.(ofReduceBool|trustCompiler)$") | not)]' "$work/audit.json")"
          if [ "$(jq 'length' <<<"$bad")" != 0 ]; then
            echo "::error::declarations depending on an axiom outside the allowlist"
            jq -r '.[] | "\(.decl): \(.axioms | join(", "))"' <<<"$bad" | head -50
            exit 1
          fi
