name: CI

on:
  push:
    branches: [main, "lean-*"]
  pull_request:

jobs:
  blueprint-refs:
    # Every blueprint \lean{...} reference must name a declaration in the
    # sources. Textual, without loading Lean: the declaration list is the one
    # build_web.sh extracts for the published blueprint (docs.yml runs the same
    # check), so the blueprint cannot drift from the library between releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract the declaration list
        run: python3 scripts/gen_decl_index.py

      - name: Check that every \lean{...} reference names a declaration
        run: |
          python3 - <<'PY'
          import glob, re, sys
          decls = set(open("blueprint/lean_decls").read().split())
          missing = []
          for f in sorted(glob.glob("blueprint/src/chapters/*.tex")):
              for m in re.finditer(r"\\lean\{([^}]*)\}", open(f).read()):
                  missing += [(f, n.strip()) for n in m.group(1).split(",")
                              if n.strip() not in decls]
          for f, n in missing:
              print(f"::error file={f}::unknown declaration {n}")
          sys.exit(1 if missing else 0)
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        run: lake exe cache get || true

      - name: Build, which is also the sorry guard
        # The package is built under `-E hasSorry` (see lakefile.lean), so Lean
        # reports a declaration whose proof term reaches `sorryAx` as an error
        # and the build fails on it. The previous separate step grepped the log
        # for "uses 'sorry'" with straight quotes; Lean writes the word in
        # backticks, so that step matched nothing and passed unconditionally.
        run: |
          set -euo pipefail
          lake build 2>&1 | tee build.log

      - name: Guard — axiom allowlist
        run: |
          set -euo pipefail
          # The only file permitted to declare axioms is Curve25519.lean, which
          # holds the four AUCurves/fiat-crypto trust edges: curve25519Prime_prime,
          # curve25519SubgroupOrder_prime, curve25519_basepoint,
          # curve25519_basepoint_addOrder. An axiom anywhere else fails CI.
          found="$(git grep -nE '^[[:space:]]*axiom[[:space:]]' -- 'CatCryptCore' ':!CatCryptCore/Crypto/KeyAgreement/Curve25519.lean' || true)"
          if [ -n "$found" ]; then
            echo "::error::Axiom declarations outside the allowlist:"
            echo "$found"
            exit 1
          fi

      - name: Guard — no native_decide
        run: |
          set -euo pipefail
          found="$(git grep -n 'native_decide' -- 'CatCryptCore' || true)"
          if [ -n "$found" ]; then
            echo "::error::native_decide adds the ofReduceBool trust edge:"
            echo "$found"
            exit 1
          fi
